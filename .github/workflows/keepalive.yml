# Keeps the free Supabase projects from being paused for inactivity (a project that gets no
# requests for a week is paused). Calls ping(), a public function that returns 1 and touches
# nothing, with the publishable key only (the same key the app uses; it is safe to be in a
# secret and would be safe in the open).
#
# Secrets (Settings -> Secrets and variables -> Actions): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
# Point them at PROD. Add a second pair named DEV_* if DEV should be kept awake too.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days, 11:47 Sri Lanka time
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets."
            exit 1
          fi
          reply="$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" -d '{}')"
          if [ "$(printf '%s' "$reply" | tr -d '[:space:]')" != "1" ]; then
            echo "::error::ping() did not answer 1."
            exit 1
          fi
          echo "ping() answered 1: the project is awake."
